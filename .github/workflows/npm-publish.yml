name: npm publish

on:
  release:
    types: [created]
  workflow_dispatch:        # so you can dry-run the checks without releasing

defaults:
  run:
    working-directory: npm  # package.json is not at the repo root

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-save onnxruntime-node

      # A release tagged v1.2.0 that publishes 1.1.0 is the mistake this
      # catches. npm cannot republish a version, so it is only fixable by
      # deleting the release and starting again.
      - name: tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json $PKG   tag $TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $TAG does not match package version $PKG"; exit 1; }

      # Weights out of the tarball, every advertised model reachable, published
      # sha256 still matching its manifest, decode still agreeing.
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write       # the OIDC token npm trades for publish rights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm publish --access public
